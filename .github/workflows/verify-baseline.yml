name: Verify Repository Baseline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show Python version
        run: python3 --version

      - name: Run repository baseline verification
        run: ./scripts/verify_repo_baseline.sh
